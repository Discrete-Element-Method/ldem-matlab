name: tests-all

# The slow tests start child MATLAB processes that re-run the legacy simulations
# (about 5 minutes). They are run on demand, not on every push.
on:
  workflow_dispatch:

jobs:
  matlab:
    name: All tests (including slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b

      - name: Run the build (static analysis + all tests)
        uses: matlab-actions/run-build@v2
        with:
          tasks: check testAll

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-all
          path: |
            test-results/
            code-coverage/
          if-no-files-found: ignore
